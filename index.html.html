<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Französisch Voci Swipe</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#f2f7e8,#e6efd2);color:#172015;min-height:100vh;overflow:hidden}.app{max-width:520px;margin:auto;padding:18px;height:100vh;display:flex;flex-direction:column}h1{font-size:22px;margin:5px 0}.sub{color:#66705b;margin:0 0 12px}.progress{height:8px;background:#d6dfc4;border-radius:9px;overflow:hidden}.bar{height:100%;background:#83aa24;width:0}.stats{display:flex;justify-content:space-between;font-size:14px;margin:9px 2px}.deck{position:relative;flex:1;display:flex;align-items:center;justify-content:center}.card{position:absolute;width:100%;height:min(55vh,430px);background:#fff;border-radius:26px;box-shadow:0 14px 40px #24320d26;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;touch-action:none;user-select:none;transition:transform .22s ease,opacity .22s ease}.front{font-size:31px;font-weight:800}.back{font-size:25px;color:#678c16;margin-top:22px;display:none}.back.show{display:block}.hint{position:absolute;bottom:22px;color:#8b9382;font-size:14px}.badge{position:absolute;top:20px;font-weight:800;opacity:0}.known{left:20px;color:#4c8c16}.again{right:20px;color:#c44747}.controls{display:flex;gap:10px;margin-bottom:8px}.controls button{flex:1;padding:13px;border:0;border-radius:14px;font-weight:750;font-size:15px}.no{background:#f5dddd;color:#9b2e2e}.yes{background:#dcedbd;color:#416f0c}.flip{background:#fff;border:1px solid #d6dfc4!important}.done{background:white;border-radius:24px;padding:30px;text-align:center;box-shadow:0 14px 40px #24320d26}button{cursor:pointer}</style></head><body><div class="app"><h1>🇫🇷 Voci Swipe</h1><p class="sub">← gewusst · nicht gewusst →</p><div class="progress"><div class="bar" id="bar"></div></div><div class="stats"><span id="count"></span><span id="score"></span></div><div class="deck" id="deck"></div><div class="controls" id="controls"><button class="yes" onclick="rate(true)">← Gewusst</button><button class="flip" onclick="flip()">Umdrehen</button><button class="no" onclick="rate(false)">Nicht gewusst →</button></div></div><script>const words=[
['la famille','die Familie'],['un/une enfant','ein Kind'],['la mère','die Mutter'],['le père, le papa','der Vater'],['les parents','die Eltern'],['la sœur','die Schwester'],['le frère','der Bruder'],['la grand-mère','die Grossmutter'],['le grand-père','der Grossvater'],['les grands-parents','die Grosseltern'],['la tante','die Tante'],['un oncle','ein Onkel'],['la cousine','die Cousine'],['le cousin','der Cousin'],['le bébé','das Baby, das Kleinkind'],['la fille','die Tochter, das Mädchen'],['le fils','der Sohn'],['voici, voilà','hier ist, da ist'],['il est, elle est','er ist, sie ist'],['ils sont, elles sont','sie sind'],["c’est",'das ist'],["C’est ma famille.",'Das ist meine Familie.'],['ce sont','das sind'],['Ce sont mes grands-parents.','Das sind meine Grosseltern.'],['qui?','wer?'],["il s’appelle, elle s’appelle",'er heisst, sie heisst'],["ils s’appellent, elles s’appellent",'sie heissen'],['la fiche personnelle','der Steckbrief'],['le nom','der Name'],['le prénom','der Vorname'],['la langue','die Sprache'],['Je parle allemand, français et anglais.','Ich spreche Deutsch, Französisch und Englisch.'],
["Chouette, c’est la rentrée!",'Toll, es ist Schulanfang!'],["Zut, c’est la rentrée!",'Oje, es ist Schulanfang!'],['le livre','das Buch'],['la règle','das Lineal'],['le classeur','der Ordner'],['le cahier','das Heft'],['le crayon','der Bleistift'],['le stylo','der Kugelschreiber'],['la gomme','der Gummi'],['le tableau noir','die Wandtafel'],['la trousse','das Etui'],['la table','der Tisch'],['la chaise','der Stuhl'],['la matière scolaire','das Schulfach'],["l’allemand",'Deutsch'],['le français','Französisch'],["l’anglais",'Englisch'],['les maths, les mathématiques','Mathematik'],['les jours de la semaine','die Wochentage'],['lundi','Montag'],['mardi','Dienstag'],['mercredi','Mittwoch'],['jeudi','Donnerstag'],['vendredi','Freitag'],['samedi','Samstag'],['dimanche','Sonntag'],['une école','eine Schule'],['calculer','rechnen'],['dessiner','zeichnen'],['chanter','singen'],['expérimenter','experimentieren'],['parler français','Französisch sprechen']];
const KEY='voci-not-known-v1';
let saved=JSON.parse(localStorage.getItem(KEY)||'[]');
const id=w=>w[0]+'|||'+w[1];
let weak=words.filter(w=>saved.includes(id(w)));
let rest=words.filter(w=>!saved.includes(id(w))).sort(()=>Math.random()-.5);
let queue=[...weak,...rest],done=0,yes=0,no=0,current=null,startX=0,dx=0;const deck=document.getElementById('deck');
function render(){if(!queue.length){deck.innerHTML=`<div class="done"><h2>Runde geschafft 🎉</h2><p>Gewusst: ${yes} · Nicht gewusst: ${no}</p><button onclick="restart()">Nochmals lernen</button></div>`;controls.style.display='none';bar.style.width='100%';count.textContent=`${done} Karten`;score.textContent=`✓ ${yes} · ↻ ${no}`;return}current=queue.shift();deck.innerHTML=`<div class="card" id="card"><div class="badge known">GEWUSST</div><div class="badge again">NOCHMALS</div><div class="front">${current[0]}</div><div class="back" id="back">${current[1]}</div><div class="hint">Tippen zum Umdrehen</div></div>`;const c=card;c.addEventListener('click',e=>{if(Math.abs(dx)<8)flip()});c.addEventListener('pointerdown',e=>{startX=e.clientX;dx=0;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!startX)return;dx=e.clientX-startX;c.style.transition='none';c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;document.querySelector('.known').style.opacity=Math.max(0,-dx/100);document.querySelector('.again').style.opacity=Math.max(0,dx/100)});c.addEventListener('pointerup',()=>{if(Math.abs(dx)>90)rate(dx<0);else{c.style.transition='transform .22s';c.style.transform='';}startX=0});update()}
function flip(){const b=document.getElementById('back');if(b)b.classList.toggle('show')}
function rate(knew){const c=document.getElementById('card');if(!c)return;const key=id(current);if(knew){yes++;saved=saved.filter(x=>x!==key)}else{no++;if(!saved.includes(key))saved.push(key)}localStorage.setItem(KEY,JSON.stringify(saved));done++;c.style.transition='transform .22s,opacity .22s';c.style.transform=`translateX(${knew?-600:600}px) rotate(${knew?-20:20}deg)`;c.style.opacity=0;setTimeout(render,220)}
function update(){count.textContent=`Karte ${done+1}`;score.textContent=`✓ ${yes} · ↻ ${no}`;bar.style.width=(done/(done+queue.length+1)*100)+'%'}function restart(){saved=JSON.parse(localStorage.getItem(KEY)||'[]');weak=words.filter(w=>saved.includes(id(w)));rest=words.filter(w=>!saved.includes(id(w))).sort(()=>Math.random()-.5);queue=[...weak,...rest];done=yes=no=0;controls.style.display='flex';render()}render();</script></body></html>
